name: Web Scraper CI/CD

on:
  push:
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Validate structure
        run: |
          set -e
          test -d backend || (echo "backend missing" && exit 1)
          test -d crawler || (echo "crawler missing" && exit 1)
          test -d db || (echo "db missing" && exit 1)
          test -f docker-compose.yml || (echo "đocker-compose.yml missing" && exit 1)
          test -f init.sql || (echo "init.sql missing" && exit 1)

      - name: Install backend deps
        run: |
          cd backend
          npm ci

      - name: Install crawler deps
        run: |
          cd crawler
          npm ci

      - name: Build backend image
        run: docker build -t test-backend -f backend/Dockerfile .

      - name: Build crawler image
        run: docker build -t test-crawler -f crawler/Dockerfile .

      - name: Build nginx image
        run: docker build -t test-nginx -f nginx/Dockerfile .

  cd:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push backend
        run: |
          IMAGE=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/scraper-backend
          docker build -t $IMAGE:${{ github.sha }} -f backend/Dockerfile .
          docker push $IMAGE:${{ github.sha }}

      - name: Build & Push crawler
        run: |
          IMAGE=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/scraper-crawler
          docker build -t $IMAGE:${{ github.sha }} -f crawler/Dockerfile .
          docker push $IMAGE:${{ github.sha }}

      - name: Build & Push nginx
        run: |
          IMAGE=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/scraper-nginx
          docker build -t $IMAGE:${{ github.sha }} -f nginx/Dockerfile .
          docker push $IMAGE:${{ github.sha }}

      - name: Copy compose & init.sql
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml,init.sql"
          target: /home/ec2-user/scraper

      - name: Deploy EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /home/ec2-user/scraper

            # login ECR
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            # load env từ SSM (nếu cần)
            PARAMS=(
              REDIS_HOST
              REDIS_PORT
              PG_HOST
              PG_PORT
              PG_USER
              PG_PASSWORD
              PG_DATABASE
              NODE_ENV
            )

            for param in "${PARAMS[@]}"; do
              export $param=$(aws ssm get-parameter \
                --name "/scraper/$param" \
                --with-decryption \
                --query "Parameter.Value" \
                --output text)
            done

            # image tag
            export TAG=${{ github.sha }}

            # deploy
            docker compose down --remove-orphans
            docker compose pull
            docker compose up -d --build